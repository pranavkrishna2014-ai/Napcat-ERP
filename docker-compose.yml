# One-command local stack: PostgreSQL + the Mattress ERP API.
#   docker compose up --build
# Then the API is at http://localhost:3000/api (login: admin / admin12345).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: mattress_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d mattress_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://erp:erp@db:5432/mattress_erp?schema=public"
      JWT_SECRET: "change-me-in-production"
      JWT_EXPIRES_IN: "8h"
      PORT: "3000"
      # Optional: set a specific first-admin password (defaults to admin12345).
      # SEED_ADMIN_PASSWORD: "your-strong-password"
    ports:
      - "3000:3000"

volumes:
  pgdata:
